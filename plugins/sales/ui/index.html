<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Workspace</title>
<style>
/* Read-only view of data/gtm.db. Served on 127.0.0.1 by `gtm.py ui`. No external requests. */
:root {
  color-scheme: dark;
  --z950:#09090b; --z900:#18181b; --z800:#27272a; --z700:#3f3f46; --z600:#52525b;
  --z500:#71717a; --z400:#a1a1aa; --z300:#d4d4d8; --z200:#e4e4e7; --z100:#f4f4f5;
  --indigo:#6366f1; --indigo3:#a5b4fc; --sky4:#38bdf8;
}
* { box-sizing:border-box; scrollbar-width:thin; scrollbar-color:var(--z700) transparent; }
html, body { margin:0; height:100%; }
body { background:var(--z950); color:var(--z200); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
a { color:var(--sky4); text-decoration:none; } a:hover { text-decoration:underline; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }

/* header */
header { position:sticky; top:0; z-index:30; border-bottom:1px solid var(--z800); background:rgba(9,9,11,.9); backdrop-filter:blur(8px); }
.bar { display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px; padding:12px 20px; }
.brand { display:flex; align-items:center; gap:10px; font-weight:600; color:var(--z100); }
.brand .mark { display:grid; place-items:center; width:28px; height:28px; border-radius:6px; background:var(--indigo); color:#fff; font-weight:700; }
.brand .ws { font-weight:400; color:var(--z500); margin-left:4px; }
nav.tabs { max-width:100%; overflow-x:auto; scrollbar-width:none; display:flex; gap:4px; padding:4px; border:1px solid var(--z800); background:var(--z900); border-radius:8px; }
nav.tabs button { flex:none; padding:6px 12px; border-radius:6px; font-weight:500; color:var(--z400); }
nav.tabs button:hover { color:var(--z100); }
nav.tabs button.on { background:var(--indigo); color:#fff; }
nav.tabs .n { margin-left:6px; font-size:11px; opacity:.7; }
.live { margin-left:auto; display:flex; align-items:center; gap:16px; }
.live .state { text-align:right; font-size:12px; }
.live .dot { display:inline-block; width:6px; height:6px; border-radius:99px; margin-right:6px; vertical-align:middle; }
.live .ok { color:#6ee7b7; } .live .ok .dot { background:#34d399; }
.live .off { color:#fcd34d; } .live .off .dot { background:#fbbf24; }
.live .when { font-size:11px; color:var(--z500); }
.btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--z700); background:var(--z900); border-radius:8px; color:var(--z200); }
.btn:hover { background:var(--z800); }

main { padding:16px 20px 48px; }
.stats { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:8px; margin-bottom:16px; }
.stat { border:1px solid var(--z800); background:rgba(24,24,27,.5); border-radius:8px; padding:8px 12px; }
.stat .v { font-size:18px; font-weight:600; color:var(--z100); font-variant-numeric:tabular-nums; }
.stat .l { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--z500); }

.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:12px; }
.search { position:relative; }
.search svg { position:absolute; left:10px; top:10px; width:16px; height:16px; color:var(--z500); pointer-events:none; }
.search input { width:260px; max-width:100%; border:1px solid var(--z800); background:var(--z900); border-radius:8px; padding:8px 12px 8px 32px; color:var(--z100); outline:none; font:inherit; }
.search input:focus, select:focus { border-color:rgba(99,102,241,.6); box-shadow:0 0 0 1px rgba(99,102,241,.4); }
label.sel { display:flex; align-items:center; gap:8px; color:var(--z500); font-size:13px; }
select { border:1px solid var(--z800); background:var(--z900); border-radius:8px; padding:7px 10px; color:var(--z100); font:inherit; outline:none; }
label.check { display:flex; align-items:center; gap:6px; color:var(--z400); font-size:13px; cursor:pointer; }
.count { margin-left:auto; color:var(--z500); font-size:12px; }

/* tables */
.tablewrap { border:1px solid var(--z800); border-radius:10px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; min-width:760px; }
th { position:sticky; top:0; z-index:5; background:var(--z900); text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--z500); padding:8px 12px; border-bottom:1px solid var(--z800); }
td { padding:8px 12px; vertical-align:top; border-top:1px solid rgba(39,39,42,.7); }
tr.row { cursor:pointer; } tr.row:hover td { background:rgba(24,24,27,.4); }
tr.grp td { background:rgba(24,24,27,.8); padding:8px 12px; cursor:pointer; user-select:none; }
tr.grp:hover td { background:rgba(39,39,42,.8); }
tr.grp .lbl { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--indigo3); }
tr.grp .cnt { font-size:12px; color:var(--z500); margin-left:8px; }
tr.grp .tri { display:inline-block; width:10px; color:var(--z500); transition:transform .15s; margin-right:6px; }
tr.grp.open .tri { transform:rotate(90deg); }
tr.row.sel td { background:rgba(99,102,241,.08); }
tr.row.sel td:first-child { box-shadow:inset 2px 0 0 var(--indigo); }
.openbtn { font-weight:500; color:var(--z100); text-align:left; }
.openbtn:hover { color:var(--indigo3); }
.name { font-weight:500; color:var(--z100); }
.sub { font-size:11px; color:var(--z500); }
.desc { font-size:11px; color:var(--z500); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.co { display:flex; gap:8px; align-items:flex-start; }
.logo { display:inline-grid; place-items:center; flex:none; width:18px; height:18px; border-radius:4px; font-size:10px; font-weight:600; margin-top:1px; }
.links a { margin-right:8px; font-size:11px; }
.muted { color:var(--z600); font-size:11px; }
.num { font-variant-numeric:tabular-nums; }

/* chips (same tones as the Vercel dashboard) */
.chip { display:inline-flex; align-items:center; border-radius:6px; padding:1px 6px; font-size:11px; font-weight:500; white-space:nowrap; box-shadow:inset 0 0 0 1px var(--r); background:var(--b); color:var(--c); margin:0 4px 2px 0; }
.t-zinc   { --b:var(--z800); --c:var(--z300); --r:var(--z700); }
.t-indigo { --b:rgba(99,102,241,.15); --c:#a5b4fc; --r:rgba(99,102,241,.3); }
.t-emerald{ --b:rgba(16,185,129,.15); --c:#6ee7b7; --r:rgba(16,185,129,.3); }
.t-amber  { --b:rgba(245,158,11,.15); --c:#fcd34d; --r:rgba(245,158,11,.3); }
.t-rose   { --b:rgba(244,63,94,.15);  --c:#fda4af; --r:rgba(244,63,94,.3); }
.t-sky    { --b:rgba(14,165,233,.15); --c:#7dd3fc; --r:rgba(14,165,233,.3); }
.t-violet { --b:rgba(139,92,246,.15); --c:#c4b5fd; --r:rgba(139,92,246,.3); }
.ch { display:inline-flex; gap:4px; align-items:center; vertical-align:middle; }
.ch a, .ch span { display:inline-flex; } .ch a:hover { transform:scale(1.1); text-decoration:none; }

/* side panel (same build as the dashboard's report panel) */
.overlay { position:fixed; inset:0; z-index:40; display:flex; justify-content:flex-end; }
.backdrop { position:absolute; inset:0; background:rgba(0,0,0,.5); }
.panel { position:relative; display:flex; flex-direction:column; height:100%; width:100%; max-width:600px; background:var(--z950); border-left:1px solid var(--z800); box-shadow:-20px 0 50px rgba(0,0,0,.5); }
.panel.enter { animation:slidein .18s ease-out; }
@keyframes slidein { from { transform:translateX(40px); opacity:.4; } to { transform:none; opacity:1; } }
.ph { display:flex; align-items:flex-start; gap:12px; padding:16px 20px; border-bottom:1px solid var(--z800); }
.ph .t { font-size:15px; font-weight:600; color:var(--z100); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ph .l { font-size:12px; color:var(--z500); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
.xbtn { flex:none; border:1px solid var(--z800); border-radius:6px; padding:4px 8px; font-size:12px; color:var(--z400); }
.xbtn:hover { background:var(--z900); color:var(--z100); }
.pb { flex:1; overflow-y:auto; padding:16px 20px 28px; }
.lead { font-size:13.5px; line-height:1.6; color:var(--z200); margin:0; }
.lead.none { color:var(--z600); font-style:italic; }
.reach { margin-top:16px; border:1px solid rgba(99,102,241,.3); background:rgba(99,102,241,.05); border-radius:10px; padding:16px; }
.reach .rt { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.reach .rt span:first-child { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--indigo3); }
.why { font-size:12.5px; color:var(--z400); } .to { margin-top:4px; font-size:12px; color:var(--z500); } .to b { color:var(--z300); font-weight:400; }
.warn { color:#fcd34d; }
.msg { margin-top:12px; border:1px solid var(--z800); background:rgba(24,24,27,.8); border-radius:8px; }
.msg .mh { display:flex; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--z800); }
.msg .mh .k { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--z400); }
.msg .mh .m { font-size:11px; color:var(--z600); }
.msg .ms { display:flex; gap:8px; align-items:center; padding:6px 12px; border-bottom:1px solid rgba(39,39,42,.7); font-size:12.5px; }
.msg .ms span:first-child { color:var(--z500); } .msg .ms span:nth-child(2) { flex:1; color:var(--z100); }
.msg .mb { white-space:pre-wrap; padding:10px 12px; font-size:12.5px; line-height:1.6; color:var(--z200); }
.copy { flex:none; margin-left:auto; border:1px solid var(--z700); border-radius:4px; padding:1px 6px; font-size:10px; color:var(--z400); }
.copy:hover { background:var(--z800); color:var(--z100); }
.psec { margin-top:20px; }
.psec .st { margin-bottom:8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--z400); }
.psec .st .cnt { margin-left:8px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--z500); }
.plist { list-style:none; margin:0; padding:0; }
.plist > li { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:12.5px; padding:4px 0; }
.plist .who { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.plist .who button { color:var(--z200); } .plist .who button:hover { color:var(--indigo3); }
.connect { display:flex; width:100%; align-items:flex-start; gap:8px; margin-top:2px; border:1px solid rgba(14,165,233,.2); background:rgba(14,165,233,.05); border-radius:6px; padding:6px 10px; }
.connect .k { flex:none; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:#7dd3fc; margin-top:2px; }
.connect .b { flex:1; font-size:12px; line-height:1.55; color:var(--z200); }
.sig { font-size:12px; display:flex; gap:8px; align-items:baseline; padding:2px 0; }
.sig .on, .sig .on a { color:#fcd34d; } .sig .off { color:var(--z600); text-decoration:line-through; }
.facts { border:1px solid var(--z800); background:rgba(24,24,27,.4); border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.6; color:var(--z200); white-space:pre-wrap; }
.alert { border:1px solid rgba(245,158,11,.4); background:rgba(245,158,11,.1); color:#fde68a; border-radius:6px; padding:8px 12px; font-size:12px; }
.meta { display:grid; grid-template-columns:110px 1fr; gap:6px 12px; font-size:12.5px; }
.meta .k { color:var(--z500); } .meta .v { color:var(--z200); overflow-wrap:anywhere; }
.tl { list-style:none; margin:0; padding:0 0 0 12px; border-left:1px solid var(--z800); }
.tl li { position:relative; padding:3px 0 6px 6px; font-size:12.5px; color:var(--z300); }
.tl li::before { content:""; position:absolute; left:-16.5px; top:9px; width:8px; height:8px; border-radius:99px; background:var(--z700); }
.tl li.hi::before { background:#34d399; }
.avatar-lg { flex:none; width:30px; height:30px; border-radius:99px; display:grid; place-items:center; font-size:12px; font-weight:700; }
.vtag { display:inline-flex; border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:500; box-shadow:inset 0 0 0 1px var(--r); background:var(--b); color:var(--c); white-space:nowrap; }
.sn { display:inline-flex; gap:4px; align-items:center; border-radius:6px; padding:1px 6px; font-size:11px; font-weight:500; white-space:nowrap; }
.sn.direct { background:rgba(14,165,233,.15); color:#7dd3fc; box-shadow:inset 0 0 0 1px rgba(14,165,233,.3); }
.sn.search { color:var(--z400); box-shadow:inset 0 0 0 1px var(--z700); }
.sn:hover { text-decoration:none; filter:brightness(1.2); }
.siglines { display:flex; flex-direction:column; gap:2px; }
.siglines span { font-size:11px; color:#fcd34d; } .siglines a { color:#fcd34d; } .siglines .d { color:var(--z600); margin-left:4px; }

/* today */
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap:12px; }
.card { border:1px solid var(--z800); background:rgba(24,24,27,.5); border-radius:10px; padding:12px 14px; }
.card h3 { margin:0 0 8px; font-size:13px; font-weight:600; color:var(--z100); display:flex; gap:8px; align-items:center; }
.card ul { margin:0; padding-left:16px; font-size:13px; color:var(--z300); }
.card li { margin-bottom:3px; }
.card.zero { opacity:.55; }

.empty { border:1px dashed var(--z700); border-radius:10px; padding:40px 20px; text-align:center; color:var(--z400); }
.empty b { color:var(--z100); }

/* a row that just arrived flashes once, so you see the database fill up */
@keyframes flash { from { background:rgba(99,102,241,.28); } to { background:transparent; } }
tr.fresh td, li.fresh { animation:flash 3s ease-out; }

/* profile */
.hero { display:flex; gap:18px; align-items:flex-start; padding:20px; border:1px solid var(--z800); border-radius:14px; margin-bottom:22px;
  background:linear-gradient(135deg, rgba(99,102,241,.13), rgba(24,24,27,.45) 55%); }
.biglogo { flex:none; width:64px; height:64px; border-radius:14px; display:grid; place-items:center; overflow:hidden; font-size:26px; font-weight:700; }
.biglogo.img { background:#fff; padding:8px; }
.biglogo img { width:100%; height:100%; object-fit:contain; }
.hero h1 { margin:0; font-size:24px; font-weight:650; color:var(--z100); letter-spacing:-.01em; }
.hero .links { margin:4px 0 10px; } .hero .links a { font-size:12.5px; margin-right:12px; }
.hero .headline { font-size:15px; color:var(--z200); margin:0 0 4px; }
.hero .about { font-size:13px; color:var(--z400); margin:0 0 10px; max-width:820px; }
.sect { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:26px 0 12px; }
.sect h2 { margin:0; font-size:16px; font-weight:600; color:var(--z100); }
.progress { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--z500); }
.progress .track { width:120px; height:6px; border-radius:99px; background:var(--z800); overflow:hidden; }
.progress .fill { height:100%; background:linear-gradient(90deg, var(--indigo), #34d399); border-radius:99px; }
.legend { margin-left:auto; display:flex; gap:12px; font-size:11.5px; color:var(--z500); }
.sdot { display:inline-block; width:7px; height:7px; border-radius:99px; margin-right:5px; vertical-align:middle; flex:none; }
.s-confirmed { background:#34d399; } .s-check { background:#fbbf24; } .s-missing { background:var(--z600); }
.pgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:12px; }
.pcard { border:1px solid var(--z800); background:rgba(24,24,27,.5); border-radius:12px; padding:14px 16px 8px; }
.pcard h3 { margin:0 0 4px; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--indigo3); }
.param { display:grid; grid-template-columns:128px 1fr; gap:12px; padding:9px 0; border-top:1px solid rgba(39,39,42,.8); }
.pcard h3 + .param { border-top:0; }
.param .k { font-size:12px; color:var(--z400); display:flex; align-items:baseline; }
.param .v { font-size:13.5px; color:var(--z100); overflow-wrap:anywhere; }
.param .v.none { color:var(--z600); font-style:italic; }
.param .src { font-size:11px; color:var(--z500); margin-top:2px; }
.persona-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.persona-head .avatar { width:34px; height:34px; border-radius:99px; display:grid; place-items:center; font-weight:700; }
.persona-head .pn { font-size:15px; font-weight:600; color:var(--z100); }
.checks { list-style:none; margin:0; padding:4px 0 8px; }
.checks li { display:flex; gap:10px; align-items:flex-start; padding:6px 0; font-size:13.5px; color:var(--z100); }
.checks svg { flex:none; margin-top:2px; }
.quote { border-left:3px solid var(--indigo); padding:4px 0 4px 12px; color:var(--z200); font-size:14px; margin:6px 0 12px; }

@media (max-width:640px) {
  .bar, main { padding-left:16px; padding-right:16px; }
  .live .state { display:none; }
  .search input { width:100%; }
  .hero { flex-direction:column; }
  nav.tabs { order:3; width:100%; }
  .legend { margin-left:0; }
  .param { grid-template-columns:1fr; gap:2px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="mark">S</span><span>Sales<span class="ws" id="ws"></span></span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="live">
      <div class="state"><div id="live" class="off"><span class="dot"></span>Connecting…</div><div class="when" id="when"></div></div>
      <button class="btn" id="refresh" title="Refresh now">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a7 7 0 00-6.32 4H6a1 1 0 010 2H2a1 1 0 01-1-1V4a1 1 0 112 0v1.1A9 9 0 1110 19a1 1 0 110-2 7 7 0 100-14z" clip-rule="evenodd"/></svg>Refresh</button>
    </div>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="content"></div>
</main>
<div id="panel"></div>

<script>
"use strict";
const POLL_MS = 4000;
const TABS = [
  { id: "profile", label: "Profile" },
  { id: "today", label: "Today" },
  { id: "accounts", label: "Accounts" },
  { id: "contacts", label: "Contacts" },
  { id: "signals", label: "Signals" },
];
const store = {
  get(k, d) { try { const v = localStorage.getItem("gtm-ui:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("gtm-ui:" + k, JSON.stringify(v)); } catch {} },
};
const S = {
  data: null, lastText: "", tab: store.get("tab", "profile"), q: "",
  group: store.get("group", { accounts: "fit", contacts: "stage" }),
  activeOnly: true, panel: null, closed: new Set(),
  seen: null, fresh: new Map(),
};

// ------------------------------------------------------------------ helpers
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const siteUrl = (d) => (d ? "https://" + String(d).replace(/^https?:\/\//, "").replace(/\/+$/, "") : null);
// a full profile was pasted and read (gtm.py profile-facts / add-contact mark it); a list line is not enough
const hasProfile = (c) => /\[profile \d{4}-\d{2}-\d{2}\]/.test(c.profile_facts || "");
const fullName = (c) => [c.first_name, c.last_name].filter(Boolean).join(" ") || "(no name)";
const day = (t) => (t ? String(t).slice(0, 10) : "");
const daysAgo = (t) => { const d = Date.parse(t); return isNaN(d) ? null : Math.floor((Date.now() - d) / 864e5); };
const chip = (text, tone = "zinc", title = "") => `<span class="chip t-${tone}"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</span>`;
const link = (href, text) => { const u = safeUrl(href); return u ? `<a href="${esc(u)}" target="_blank" rel="noreferrer">${esc(text)}</a>` : ""; };
const HUES = [["rgba(99,102,241,.2)", "#a5b4fc"], ["rgba(16,185,129,.2)", "#6ee7b7"], ["rgba(14,165,233,.2)", "#7dd3fc"],
              ["rgba(245,158,11,.2)", "#fcd34d"], ["rgba(244,63,94,.2)", "#fda4af"], ["rgba(139,92,246,.2)", "#c4b5fd"]];
const hasLogo = (domain) => !!domain && (S.data?.logos || []).includes(String(domain).toLowerCase());
function logo(name, domain, size = 18) {
  const dim = size === 18 ? "" : `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.45)}px;border-radius:${Math.round(size / 4)}px;`;
  if (hasLogo(domain)) return `<span class="logo" style="${dim}background:#fff;padding:1px"><img src="/logo/${esc(String(domain).toLowerCase())}" alt="" style="width:100%;height:100%;object-fit:contain"></span>`;
  const s = (name || domain || "?").trim() || "?";
  const [bg, fg] = HUES[s.charCodeAt(0) % HUES.length];
  return `<span class="logo" style="${dim}background:${bg};color:${fg}">${esc(s.charAt(0).toUpperCase())}</span>`;
}
function bigLogo(name, domain) {
  if (hasLogo(domain)) return `<div class="biglogo img"><img src="/logo/${esc(String(domain).toLowerCase())}" alt="${esc(name)} logo"></div>`;
  const s = (name || domain || "?").trim() || "?";
  const [bg, fg] = HUES[s.charCodeAt(0) % HUES.length];
  return `<div class="biglogo" style="background:${bg};color:${fg}">${esc(s.charAt(0).toUpperCase())}</div>`;
}
const TONES = ["indigo", "sky", "violet", "amber", "emerald"];
const toneFor = (s) => TONES[[...String(s)].reduce((a, c) => a + c.charCodeAt(0), 0) % TONES.length];

// LinkedIn icon: grey when the profile URL is missing, LinkedIn blue when present
const CH_OFF = "#52525b";
const GLYPH = {
  linkedin: (c) => `<svg width="13" height="13" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="4" fill="${c}"/><rect x="5.2" y="9.4" width="3" height="9.2" fill="#fff"/><circle cx="6.7" cy="6.4" r="1.75" fill="#fff"/><path d="M10.6 9.4h2.9v1.3c.5-.9 1.6-1.5 3-1.5 2.6 0 3.3 1.7 3.3 4v5.4h-3v-4.8c0-1.1-.2-2-1.4-2s-1.8.9-1.8 2v4.8h-3z" fill="#fff"/></svg>`,
};
const CH_ON = { linkedin: "#0A66C2" };
function channel(kind, value) {
  if (!value) return `<span title="No LinkedIn profile URL">${GLYPH.linkedin(CH_OFF)}</span>`;
  const href = safeUrl(value);
  return href ? `<a href="${esc(href)}" target="_blank" rel="noreferrer" title="${esc("LinkedIn: " + value)}">${GLYPH.linkedin(CH_ON.linkedin)}</a>`
              : `<span title="${esc("LinkedIn: " + value)}">${GLYPH.linkedin(CH_ON.linkedin)}</span>`;
}
const channels = (c) => `<span class="ch">${channel("linkedin", c.linkedin_url)}</span>`;
// one icon set per account: lit when at least one person has that channel
function peopleCell(people) {
  const n = (f) => people.filter((c) => c[f]).length;
  const icon = (kind, f, label) => `<span title="${n(f)} of ${people.length} with ${label}">${GLYPH[kind](n(f) ? CH_ON[kind] : CH_OFF)}</span>`;
  return `<span class="num" style="margin-right:6px">${people.length}</span><span class="ch">${icon("linkedin", "linkedin_url", "LinkedIn")}</span>`;
}

const FIT = { yes: ["Fit", "emerald"], unknown: ["Unknown", "zinc"], no: ["Not fit", "rose"] };
const fitTag = (a) => a.status === "disqualified" ? `<span class="vtag t-rose">Disqualified</span>`
  : `<span class="vtag t-${(FIT[a.fit] || FIT.unknown)[1]}" title="${esc(a.fit_reason || "")}">${(FIT[a.fit] || FIT.unknown)[0]}</span>`;
/** One click to the account in Sales Navigator; a name search when the LinkedIn id is unknown. */
function salesNav(a) {
  const id = (a.linkedin_url || "").match(/linkedin\.com\/(?:company|sales\/company)\/(\d+)/)?.[1];
  if (id) return `<a class="sn direct" href="https://www.linkedin.com/sales/company/${id}" target="_blank" rel="noreferrer" title="Open the account in Sales Navigator">Open ↗</a>`;
  if (!a.name) return '<span class="muted">—</span>';
  return `<a class="sn search" href="https://www.linkedin.com/sales/search/company?query=(keywords:${encodeURIComponent(a.name)})" target="_blank" rel="noreferrer" title="No LinkedIn id stored: search Sales Navigator by name">Search ↗</a>`;
}
const copyBtn = (key) => `<button class="copy" data-copy="${esc(key)}">copy</button>`;
const draftById = (id) => S.data.drafts.find((x) => String(x.id) === String(id));
const KIND_LABEL = { "linkedin-connect": "LinkedIn connect note", "linkedin-dm": "LinkedIn DM" };
function msgCard(x, to) {
  const n = (x.body || "").length;
  const meta = [to ? "to " + to : "", x.kind === "linkedin-connect" ? `${n}/200 characters` : x.kind === "linkedin-dm" ? `${n} characters` : ""].filter(Boolean).join(" · ");
  return `<div class="msg"><div class="mh"><span class="k">${esc(KIND_LABEL[x.kind] || x.kind || x.channel || "Draft")}</span><span class="m">${esc(meta)}</span>${copyBtn("d" + x.id + ":all")}</div>
    ${x.subject ? `<div class="ms"><span>Subject:</span><span>${esc(x.subject)}</span>${copyBtn("d" + x.id + ":subject")}</div>` : ""}
    <div class="mb">${esc(x.body || "")}</div></div>`;
}
function fitChip(a) {
  if (a.status === "disqualified") return chip("Disqualified", "rose", a.fit_reason);
  const [t, tone] = FIT[a.fit] || FIT.unknown;
  return chip(t, tone, a.fit_reason);
}

// the furthest a person has come, from their touches
const STAGES = [
  { id: "new", label: "Not contacted", tone: "zinc" },
  { id: "invited", label: "Invited", tone: "amber" },
  { id: "accepted", label: "Accepted", tone: "sky" },
  { id: "messaged", label: "DM sent", tone: "indigo" },
  { id: "replied", label: "Replied", tone: "emerald" },
  { id: "meeting", label: "Meeting", tone: "emerald" },
];
const KIND_STAGE = { invite: "invited", accepted: "accepted", message: "messaged", reply: "replied", meeting: "meeting" };
const RANK = Object.fromEntries(STAGES.map((s, i) => [s.id, i]));
function stageOf(c) {
  let best = "new";
  for (const t of c._touches) { const s = KIND_STAGE[t.kind]; if (s && RANK[s] > RANK[best]) best = s; }
  return STAGES[RANK[best]];
}

// ------------------------------------------------------------------ data
function index(d) {
  const byAcc = new Map(d.accounts.map((a) => [a.id, a]));
  for (const a of d.accounts) { a._contacts = []; a._signals = []; }
  for (const c of d.contacts) { c._touches = []; c._drafts = []; c._acc = byAcc.get(c.account_id) || null; if (c._acc) c._acc._contacts.push(c); }
  const byCon = new Map(d.contacts.map((c) => [c.id, c]));
  for (const t of d.touches) byCon.get(t.contact_id)?._touches.push(t);
  for (const x of d.drafts) byCon.get(x.contact_id)?._drafts.push(x);
  for (const s of d.signals) { s._acc = byAcc.get(s.account_id) || null; if (s._acc) s._acc._signals.push(s); }
  return d;
}

function markFresh(d) {
  const ids = { a: d.accounts.map((x) => x.id), c: d.contacts.map((x) => x.id), s: d.signals.map((x) => x.id) };
  if (S.seen) {
    const t = Date.now();
    for (const k of Object.keys(ids)) for (const id of ids[k]) if (!S.seen[k].has(id)) S.fresh.set(k + id, t);
  }
  S.seen = { a: new Set(ids.a), c: new Set(ids.c), s: new Set(ids.s) };
  for (const [k, t] of S.fresh) if (Date.now() - t > 6000) S.fresh.delete(k);
}
const fresh = (k, id) => (S.fresh.has(k + id) ? " fresh" : "");

async function load(force) {
  try {
    const r = await fetch("/api/data", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const text = await r.text();
    setLive(true);
    if (text === S.lastText && !force) return;
    S.lastText = text;
    const d = index(JSON.parse(text));
    markFresh(d);
    S.data = d;
    document.getElementById("ws").textContent = d.workspace ? " · " + d.workspace : "";
    renderTabs(); renderStats(); renderContent(); renderPanel(false);
  } catch (e) {
    setLive(false);
  }
}
function setLive(ok) {
  const el = document.getElementById("live");
  el.className = ok ? "ok" : "off";
  el.innerHTML = `<span class="dot"></span>${ok ? "Live · local database" : "Not connected: is gtm.py ui running?"}`;
  if (ok) document.getElementById("when").textContent = "as of " + new Date().toLocaleTimeString();
}

// ------------------------------------------------------------------ layout
function renderTabs() {
  const d = S.data;
  const n = d ? { accounts: d.accounts.length, contacts: d.contacts.length, signals: d.signals.filter((s) => s.active).length,
                  today: d.pipeline.reduce((a, p) => a + (p.key === "old_signals" ? 0 : p.rows.length), 0) } : {};
  document.getElementById("tabs").innerHTML = TABS.map((t) =>
    `<button data-tab="${t.id}" class="${S.tab === t.id ? "on" : ""}">${t.label}${n[t.id] != null ? `<span class="n">${n[t.id]}</span>` : ""}</button>`).join("");
}

function renderStats() {
  const d = S.data;
  const week = d.touches.filter((t) => (daysAgo(t.at) ?? 99) <= 7);
  const stat = (v, l) => `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  document.getElementById("stats").innerHTML = [
    stat(d.accounts.length, "Accounts"),
    stat(d.accounts.filter((a) => a.fit === "yes" && a.status !== "disqualified").length, "Fit accounts"),
    stat(d.contacts.length, "People"),
    stat(d.contacts.filter(hasProfile).length, "Profiles read"),
    stat(d.signals.filter((s) => s.active).length, "Active signals"),
    stat(d.drafts.length, "Drafts ready"),
    stat(week.length, "Touches, 7 days"),
  ].join("");
}

const SEARCH_SVG = `<svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.45 4.39l3.08 3.08a1 1 0 01-1.42 1.42l-3.08-3.08A7 7 0 012 9z" clip-rule="evenodd"/></svg>`;
const GROUPS = {
  accounts: [["fit", "Fit"], ["segment", "Segment"], ["source", "Source"], ["none", "Nothing"]],
  contacts: [["stage", "Stage"], ["company", "Company"], ["persona", "Persona"], ["none", "Nothing"]],
};
function renderToolbar() {
  const t = S.tab;
  let html = "";
  if (t !== "today" && t !== "profile") html += `<div class="search">${SEARCH_SVG}<input id="q" placeholder="Search ${t}…" value="${esc(S.q)}"></div>`;
  if (GROUPS[t]) html += `<label class="sel">Group by <select id="group">${GROUPS[t].map(([v, l]) =>
      `<option value="${v}"${S.group[t] === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>`;
  if (t === "signals") html += `<label class="check"><input type="checkbox" id="active"${S.activeOnly ? " checked" : ""}> Active only</label>`;
  html += `<span class="count" id="count"></span>`;
  document.getElementById("toolbar").innerHTML = html;
}

function renderContent() {
  const el = document.getElementById("content");
  if (!S.data) return;
  document.getElementById("stats").style.display = S.tab === "profile" ? "none" : "";
  if (S.tab !== "profile" && !S.data.accounts.length && !S.data.contacts.length) {
    el.innerHTML = `<div class="empty"><b>The database is empty.</b><br>Ask Claude to <b>start</b>. New accounts, people and signals show up here by themselves.</div>`;
    document.getElementById("count").textContent = "";
    return;
  }
  const r = { profile: viewProfile, today: viewToday, accounts: viewAccounts, contacts: viewContacts, signals: viewSignals }[S.tab]();
  el.innerHTML = r.html;
  const cnt = document.getElementById("count");
  if (cnt) cnt.textContent = r.count ?? "";
}

const match = (q, ...vals) => !q || vals.some((v) => String(v ?? "").toLowerCase().includes(q));

function grouped(rows, keyFn, order, renderRow, cols, tab) {
  const groups = new Map();
  for (const r of rows) { const k = keyFn(r) || "—"; (groups.get(k) || groups.set(k, []).get(k)).push(r); }
  let keys = [...groups.keys()];
  keys.sort(order ? (a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) : (a, b) => groups.get(b).length - groups.get(a).length);
  if (keys.length === 1 && keys[0] === "*") return groups.get("*").map(renderRow).join("");
  return keys.map((k) => {
    const id = tab + ":" + k, open = !S.closed.has(id);
    return `<tr class="grp${open ? " open" : ""}" data-grp="${esc(id)}"><td colspan="${cols}"><span class="tri">▶</span><span class="lbl">${esc(k)}</span><span class="cnt">${groups.get(k).length}</span></td></tr>` +
      (open ? groups.get(k).map(renderRow).join("") : "");
  }).join("");
}

// ------------------------------------------------------------------ views
function viewAccounts() {
  const q = S.q.trim().toLowerCase();
  const rows = S.data.accounts.filter((a) => match(q, a.name, a.domain, a.industry, a.segment, a.description, a.country, a.source));
  const g = S.group.accounts;
  const key = { fit: (a) => (a.status === "disqualified" ? "Disqualified" : FIT[a.fit]?.[0] || "Unknown"),
                segment: (a) => a.segment, source: (a) => a.source, none: () => "*" }[g];
  const order = g === "fit" ? ["Fit", "Unknown", "Not fit", "Disqualified"] : null;
  const COLS = 8;
  const row = (a) => {
    const people = a._contacts, sig = a._signals.filter((s) => s.active);
    const sel = S.panel?.type === "a" && S.panel.id === a.id ? " sel" : "";
    return `<tr class="row${sel}${fresh("a", a.id)}" data-panel="a:${a.id}">
      <td><div class="co">${logo(a.name, a.domain)}<div style="min-width:0">
        <button class="openbtn" data-panel="a:${a.id}" title="Open account">${esc(a.name)}</button>
        <div class="links">${a.domain ? link(siteUrl(a.domain), a.domain) : ""}${a.linkedin_url ? link(a.linkedin_url, "in") : ""}</div>
        ${a.description ? `<div class="desc">${esc(a.description)}</div>` : ""}</div></div></td>
      <td>${fitTag(a)}</td>
      <td>${sig.length ? `<div class="siglines">${sig.slice(0, 3).map((s) => `<span title="${esc(s.detail || "")}">${s.source_url ? link(s.source_url, s.type) : esc(s.type)}<span class="d">${esc((s.observed_at || "").slice(0, 7))}</span></span>`).join("")}${sig.length > 3 ? `<span class="muted">+${sig.length - 3} more</span>` : ""}</div>` : '<span class="muted">—</span>'}</td>
      <td>${people.length ? peopleCell(people) : '<span class="muted">none yet</span>'}</td>
      <td>${salesNav(a)}</td>
      <td>${a.segment ? chip(a.segment, "indigo") : '<span class="muted">—</span>'}</td>
      <td class="sub">${[a.size_employees ? a.size_employees + " staff" : "", a.country].filter(Boolean).map(esc).join(" · ") || "—"}</td>
      <td class="sub">${esc(day(a.updated_at || a.created_at))}</td></tr>`;
  };
  const head = `<tr><th style="width:32%">Company</th><th>Fit</th><th>Signals</th><th>People</th><th>Sales Nav</th><th>Segment</th><th>Size · country</th><th>Updated</th></tr>`;
  return { count: `${rows.length} account${rows.length === 1 ? "" : "s"}`,
           html: `<div class="tablewrap"><table><thead>${head}</thead><tbody>${grouped(rows, key, order, row, COLS, "accounts")}</tbody></table></div>` };
}

function viewContacts() {
  const q = S.q.trim().toLowerCase();
  const rows = S.data.contacts.filter((c) => match(q, fullName(c), c.title, c.persona, c._acc?.name, c.location));
  const g = S.group.contacts;
  const key = { stage: (c) => stageOf(c).label, company: (c) => c._acc?.name, persona: (c) => c.persona, none: () => "*" }[g];
  const order = g === "stage" ? STAGES.map((s) => s.label).reverse() : null;
  const COLS = 7;
  const row = (c) => {
    const st = stageOf(c), last = c._touches[c._touches.length - 1];
    const sel = S.panel?.type === "c" && S.panel.id === c.id ? " sel" : "";
    return `<tr class="row${sel}${fresh("c", c.id)}" data-panel="c:${c.id}">
      <td><button class="openbtn" data-panel="c:${c.id}">${esc(fullName(c))}</button><div class="sub">${esc(c.title || "")}</div></td>
      <td><div class="co">${logo(c._acc?.name, c._acc?.domain)}<span>${esc(c._acc?.name || "—")}</span></div></td>
      <td>${c.persona ? chip(c.persona, "violet") : '<span class="muted">—</span>'}</td>
      <td>${channels(c)}</td>
      <td>${chip(st.label, st.tone)}${c._drafts.length ? chip(c._drafts.length + " draft", "indigo") : ""}</td>
      <td class="sub">${last ? esc(`${last.kind} · ${last.channel} · ${day(last.at)}`) : "—"}</td>
      <td class="sub">${esc(c.connection_degree || "")}</td></tr>`;
  };
  const head = `<tr><th style="width:24%">Person</th><th>Company</th><th>Persona</th><th>Channels</th><th>Stage</th><th>Last touch</th><th>Degree</th></tr>`;
  return { count: `${rows.length} ${rows.length === 1 ? "person" : "people"}`,
           html: `<div class="tablewrap"><table><thead>${head}</thead><tbody>${grouped(rows, key, order, row, COLS, "contacts")}</tbody></table></div>` };
}

// ------------------------------------------------------------------ side panel
function accountPanel(a) {
  const people = a._contacts;
  const active = a._signals.filter((s) => s.active);
  const drafts = people.flatMap((c) => c._drafts.map((x) => ({ x, c })));
  const best = people.find((c) => c._drafts.length) || people.find((c) => c.persona && stageOf(c).id === "new")
    || people.find((c) => c.persona) || people.find((c) => stageOf(c).id !== "new") || people[0];
  const contacted = people.filter((c) => stageOf(c).id !== "new").length;
  const top = active[0];
  const head = `${logo(a.name, a.domain, 28)}
    <div style="min-width:0;flex:1"><div class="t">${esc(a.name)}</div>
    <div class="l">${a.domain ? link(siteUrl(a.domain), a.domain) : ""}${a.linkedin_url ? link(a.linkedin_url, "LinkedIn") : ""}${salesNav(a)}<span>· added ${esc(day(a.created_at))}</span></div></div>`;
  let b = `<p class="lead${a.description ? "" : " none"}">${esc(a.description || "No description yet.")}</p>`;

  b += `<section class="reach"><div class="rt"><span>How to reach out</span>${top ? chip("Lead: " + top.type + " signal", "amber") : ""}</div>
    <div class="why">${top ? `${esc(top.detail || top.type)}${top.observed_at ? ` · seen ${esc(day(top.observed_at))}` : ""}. Open with what you saw, then one sentence on why it usually matters.`
                          : "No active signal yet. Without a reason to reach out now, start with a warm path or find a signal first."}</div>
    <div class="to">To: ${best ? `<b>${esc(fullName(best))}${best.title ? " · " + esc(best.title) : ""}</b>`
                              : `<span class="warn">no contact yet, find the right person in Sales Navigator</span> ${salesNav(a)}`}</div>
    ${drafts.map(({ x, c }) => msgCard(x, fullName(c))).join("")}
    ${best && !hasProfile(best) ? `<div class="alert" style="margin-top:12px"><b>Before writing: </b>paste ${esc(best.first_name || "their")}'s full profile, so the note is built on true facts.</div>` : ""}
  </section>`;

  b += `<section class="psec"><div class="st">Fit</div><div class="meta">
    <span class="k">Verdict</span><span class="v">${fitTag(a)} ${esc(a.fit_reason || "")}</span>
    ${a.industry ? `<span class="k">Industry</span><span class="v">${esc(a.industry)}</span>` : ""}
    ${a.size_employees || a.country ? `<span class="k">Size · country</span><span class="v">${esc([a.size_employees ? a.size_employees + " staff" : "", a.country].filter(Boolean).join(" · "))}</span>` : ""}
    ${a.segment ? `<span class="k">Segment</span><span class="v">${chip(a.segment, "indigo")}</span>` : ""}
    <span class="k">Source</span><span class="v">${esc(a.source || "—")}</span></div></section>`;

  b += `<section class="psec"><div class="st">Contacts${people.length ? `<span class="cnt">${people.length} · ${people.filter(hasProfile).length} profiles read · ${contacted} contacted</span>` : ""}</div>
    ${people.length ? `<ul class="plist">${people.map((c) => {
      const st = stageOf(c), note = c._drafts.find((x) => x.kind === "linkedin-connect");
      return `<li>${channels(c)}<span class="who"><button data-panel="c:${c.id}">${esc(fullName(c))}</button><span class="sub" style="margin-left:6px">${esc([c.persona, c.title].filter(Boolean).join(" · "))}</span></span>${chip(st.label, st.tone)}
        ${note ? `<div class="connect"><span class="k">Connect</span><span class="b">${esc(note.body)}<span class="muted" style="margin-left:6px">${(note.body || "").length}/200</span></span>${copyBtn("d" + note.id + ":all")}</div>` : ""}</li>`;
    }).join("")}</ul>` : '<div class="muted">No contacts yet.</div>'}</section>`;

  b += `<section class="psec"><div class="st">Signals</div>${a._signals.length ? a._signals.map((s) => `<div class="sig"><span class="${s.active ? "on" : "off"}">${s.source_url ? link(s.source_url, s.detail || s.type) : esc(s.detail || s.type)}</span>${chip(s.type, toneFor(s.type))}<span class="muted">${esc(day(s.observed_at))}</span></div>`).join("") : '<div class="muted">None found.</div>'}</section>`;

  if (a.notes) b += `<section class="psec"><div class="st">Notes</div><div class="facts">${esc(a.notes)}</div></section>`;
  return { head, body: b };
}

function contactPanel(c) {
  const a = c._acc, st = stageOf(c);
  const [bg, fg] = HUES[(fullName(c).charCodeAt(0) || 0) % HUES.length];
  const initials = [c.first_name, c.last_name].filter(Boolean).map((x) => x[0]).join("").toUpperCase() || "?";
  const head = `<span class="avatar-lg" style="background:${bg};color:${fg}">${esc(initials)}</span>
    <div style="min-width:0;flex:1"><div class="t">${esc(fullName(c))}</div>
    <div class="l"><span>${esc(c.title || "")}</span>${a ? `<span>at <button class="openbtn" style="font-weight:400;color:var(--sky4)" data-panel="a:${a.id}">${esc(a.name)}</button></span>` : ""}${channels(c)}</div></div>`;
  let b = `<div>${chip(st.label, st.tone)}${c.persona ? chip(c.persona, "violet") : ""}${c.connection_degree ? chip(c.connection_degree + " degree", "zinc") : ""}${c.location ? `<span class="sub">${esc(c.location)}</span>` : ""}</div>`;
  b += `<section class="psec"><div class="st">From the full profile</div>${hasProfile(c) ? `<div class="facts">${esc(c.profile_facts)}</div>`
        : `<div class="alert">Full profile not read yet. Paste it (About, Experience, Activity) before any opener.</div>${c.profile_facts ? `<div class="facts" style="margin-top:8px">${esc(c.profile_facts)}</div>` : ""}`}</section>`;
  b += `<section class="reach"><div class="rt"><span>Messages</span>${c._drafts.length ? chip(c._drafts.length + " ready", "indigo") : ""}</div>
        ${c._drafts.length ? c._drafts.map((x) => msgCard(x, "")).join("") : '<div class="why">No drafts yet. Ask Claude for a connect note for this person.</div>'}</section>`;
  b += `<section class="psec"><div class="st">Touches</div>${c._touches.length ? `<ul class="tl">${c._touches.slice().reverse().map((t) =>
        `<li class="${["reply", "meeting", "accepted"].includes(t.kind) ? "hi" : ""}"><b>${esc(t.kind)}</b> · ${esc(t.channel)} <span class="muted">${esc(day(t.at))}</span>${t.outcome ? `<div class="sub">${esc(t.outcome)}</div>` : ""}</li>`).join("")}</ul>` : '<div class="muted">Not contacted yet.</div>'}</section>`;
  b += `<section class="psec"><div class="st">Details</div><div class="meta">
        <span class="k">LinkedIn</span><span class="v">${c.linkedin_url ? link(c.linkedin_url, c.linkedin_url.replace(/^https?:\/\/(www\.)?/, "")) : '<span class="muted">missing</span>'}</span>
        <span class="k">Source</span><span class="v">${esc(c.source || "—")} <span class="sub">· added ${esc(day(c.created_at))}</span></span></div></section>`;
  return { head, body: b };
}

function renderPanel(entering) {
  const el = document.getElementById("panel");
  const p = S.panel;
  const item = p && S.data && (p.type === "a" ? S.data.accounts : S.data.contacts).find((x) => x.id === p.id);
  if (!item) { S.panel = null; el.innerHTML = ""; document.body.style.overflow = ""; return; }
  const keep = document.getElementById("pb")?.scrollTop || 0;
  const { head, body } = p.type === "a" ? accountPanel(item) : contactPanel(item);
  el.innerHTML = `<div class="overlay"><div class="backdrop" data-close></div><aside class="panel${entering ? " enter" : ""}">
    <div class="ph">${head}<button class="xbtn" data-close>Esc ✕</button></div><div class="pb" id="pb">${body}</div></aside></div>`;
  document.getElementById("pb").scrollTop = entering ? 0 : keep;
  document.body.style.overflow = "hidden";
}
function openPanel(ref) {
  const [type, id] = ref.split(":");
  S.panel = { type, id: Number(id) };
  renderPanel(true); renderContent();
}
function closePanel() { S.panel = null; renderPanel(); renderContent(); }

function viewSignals() {
  const q = S.q.trim().toLowerCase();
  const rows = S.data.signals.filter((s) => (!S.activeOnly || s.active) && match(q, s.type, s.detail, s._acc?.name));
  const row = (s) => {
    const age = daysAgo(s.observed_at);
    return `<tr class="${fresh("s", s.id).trim()}">
      <td>${chip(s.type, toneFor(s.type))}</td>
      <td><div class="co">${logo(s._acc?.name, s._acc?.domain)}<div><div class="name">${esc(s._acc?.name || "—")}</div>${s._acc ? fitChip(s._acc) : ""}</div></div></td>
      <td>${esc(s.detail || "")} ${s.source_url ? link(s.source_url, "↗") : ""}</td>
      <td class="sub">${esc(day(s.observed_at))}${age != null ? `<div>${age} days ago</div>` : ""}</td>
      <td>${s.active ? (age != null && age > 30 ? chip("Re-check", "amber") : chip("Active", "emerald")) : chip("Closed", "zinc")}</td></tr>`;
  };
  const head = `<tr><th>Type</th><th>Company</th><th style="width:40%">What we saw</th><th>Seen</th><th>Status</th></tr>`;
  return { count: `${rows.length} signals`,
           html: rows.length ? `<div class="tablewrap"><table><thead>${head}</thead><tbody>${rows.map(row).join("")}</tbody></table></div>` : `<div class="empty">No signals yet.</div>` };
}

function viewToday() {
  const html = `<div class="cards">${S.data.pipeline.map((p) => `<div class="card${p.rows.length ? "" : " zero"}">
      <h3>${esc(p.title)} ${chip(p.rows.length, p.rows.length ? (p.key === "replies" ? "emerald" : "indigo") : "zinc")}</h3>
      ${p.rows.length ? `<ul>${p.rows.slice(0, 12).map((r) => `<li>${esc(r)}</li>`).join("")}${p.rows.length > 12 ? `<li class="sub">… and ${p.rows.length - 12} more</li>` : ""}</ul>` : '<div class="muted">Nothing here.</div>'}
    </div>`).join("")}</div>`;
  return { html, count: "" };
}

// ------------------------------------------------------------------ profile
const STATUS_LABEL = { confirmed: "Confirmed", check: "Please check", missing: "Missing" };
function srcText(src) {
  if (!src) return "";
  if (safeUrl(src)) { try { const x = new URL(src); return `from ${link(src, x.pathname === "/" ? x.hostname : x.pathname)}`; } catch {} }
  return esc(src === "owner" ? "you said it" : src);
}
function paramRow(r) {
  return `<div class="param"><div class="k"><span class="sdot s-${r.status}" title="${STATUS_LABEL[r.status] || ""}"></span>${esc(r.parameter)}</div>
    <div><div class="v${r.value ? "" : " none"}">${r.value ? esc(r.value) : "missing"}</div>${r.value && r.source ? `<div class="src">${srcText(r.source)}</div>` : ""}</div></div>`;
}
function byGroup(rows) {
  const m = new Map();
  for (const r of rows) { const k = r.group || "Details"; (m.get(k) || m.set(k, []).get(k)).push(r); }
  return [...m.entries()];
}
function progress(rows) {
  const n = rows.filter((r) => r.value).length, pct = rows.length ? Math.round((100 * n) / rows.length) : 0;
  return `<div class="progress"><div class="track"><div class="fill" style="width:${pct}%"></div></div>${n} of ${rows.length} filled</div>`;
}
const LEGEND = `<div class="legend"><span><span class="sdot s-confirmed"></span>confirmed</span><span><span class="sdot s-check"></span>please check</span><span><span class="sdot s-missing"></span>missing</span></div>`;
const CHECK_SVG = `<svg width="16" height="16" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="rgba(16,185,129,.18)"/><path d="M6 10.5l2.6 2.6L14 7.6" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function viewProfile() {
  const P = S.data.profile || {}, c = P.company;
  let h = "";
  if (c) {
    const langs = (c.languages || []).map((l) => chip(l.toUpperCase(), "zinc")).join("");
    h += `<div class="hero">${bigLogo(c.name, c.domain)}<div style="min-width:0">
      <h1>${esc(c.name)}</h1>
      <div class="links">${link(siteUrl(c.domain), c.domain)}${c.linkedin ? link(c.linkedin, "LinkedIn page") : ""}</div>
      ${c.headline ? `<p class="headline">${esc(c.headline)}</p>` : ""}
      ${c.description && c.description !== c.headline ? `<p class="about">${esc(c.description)}</p>` : ""}
      <div>${langs}${c.pages_read ? chip(`Website read: ${c.pages_read} pages · ${day(c.read_at)}`, "indigo") : c.readable === false ? chip("Website could not be read automatically", "amber") : chip("Website not read yet", "zinc")}</div>
    </div></div>`;
  } else {
    h += `<div class="empty" style="margin-bottom:22px"><b>Your company is not set yet.</b><br>Type <b>start</b> in Claude and give your website: your name, logo and profile appear here.</div>`;
  }

  const icp = P.icp || [];
  h += `<div class="sect"><h2>Ideal customer profile</h2>${icp.length ? progress(icp) : ""}${LEGEND}</div>`;
  h += icp.length ? `<div class="pgrid">${byGroup(icp).map(([g, rows]) => `<div class="pcard"><h3>${esc(g)}</h3>${rows.map(paramRow).join("")}</div>`).join("")}</div>`
                  : `<div class="empty">No ICP yet: <code>directives/icp.md</code> is missing.</div>`;
  if ((P.fit_rule || []).length)
    h += `<div class="sect"><h2>Fit rule</h2><span class="sub">what research checks for every company</span></div>
      <div class="pcard"><ul class="checks">${P.fit_rule.map((x) => `<li>${CHECK_SVG}<span>${esc(x)}</span></li>`).join("")}</ul></div>`;

  const per = P.personas || [];
  const names = [...new Set(per.map((r) => r.persona).filter(Boolean))];
  h += `<div class="sect"><h2>Personas</h2>${per.length ? progress(per) : ""}</div>`;
  h += names.length ? `<div class="pgrid">${names.map((n) => {
      const rows = per.filter((r) => r.persona === n);
      const titles = rows.find((r) => r.parameter.toLowerCase() === "titles");
      const role = rows.find((r) => r.parameter.toLowerCase() === "decision role");
      const [bg, fg] = HUES[n.charCodeAt(0) % HUES.length];
      return `<div class="pcard"><div class="persona-head"><span class="avatar" style="background:${bg};color:${fg}">${esc(n.charAt(0).toUpperCase())}</span>
          <div><div class="pn">${esc(n)}</div>${role?.value ? `<div class="sub">${esc(role.value)}</div>` : ""}</div></div>
        ${titles?.value ? `<div style="margin-bottom:6px">${titles.value.split(/[,;]/).map((t) => t.trim()).filter(Boolean).map((t) => chip(t, "violet")).join("")}</div>` : ""}
        ${byGroup(rows.filter((r) => r !== titles && r !== role)).map(([g, rs]) => `<h3 style="margin-top:10px">${esc(g)}</h3>${rs.map(paramRow).join("")}`).join("")}
      </div>`;
    }).join("")}</div>` : `<div class="empty">No personas yet.</div>`;

  const me = P.me || { facts: [] };
  if (me.now || me.facts.length)
    h += `<div class="sect"><h2>About you</h2><span class="sub">used in every LinkedIn note</span></div>
      <div class="pcard">${me.now ? `<div class="quote">${esc(me.now)}</div>` : ""}
      ${me.facts.length ? `<ul class="checks">${me.facts.map((f) => `<li>${CHECK_SVG}<span>${esc(f.fact)}${f.fits ? ` <span class="sub">· fits ${esc(f.fits)}</span>` : ""}</span></li>`).join("")}</ul>` : ""}</div>`;
  return { html: h, count: "" };
}

// ------------------------------------------------------------------ events
document.addEventListener("click", (e) => {
  if (e.target.closest("a")) return;
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; S.q = ""; store.set("tab", S.tab); history.replaceState(null, "", "#" + S.tab); renderTabs(); renderToolbar(); renderContent(); return; }
  const grp = e.target.closest("[data-grp]");
  if (grp) { const id = grp.dataset.grp; S.closed.has(id) ? S.closed.delete(id) : S.closed.add(id); renderContent(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    const [ref, part] = cp.dataset.copy.split(":"), x = draftById(ref.slice(1));
    const text = !x ? "" : part === "subject" ? x.subject : x.subject ? `${x.subject}\n\n${x.body}` : x.body;
    navigator.clipboard?.writeText(text || "").then(() => { cp.textContent = "copied"; setTimeout(() => (cp.textContent = "copy"), 1200); });
    return;
  }
  if (e.target.closest("[data-close]")) { closePanel(); return; }
  const pr = e.target.closest("[data-panel]");
  if (pr) { openPanel(pr.dataset.panel); return; }
  if (e.target.closest("#refresh")) load(true);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.panel) closePanel(); });
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; renderContent(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "group") { S.group[S.tab] = e.target.value; store.set("group", S.group); renderContent(); }
  if (e.target.id === "active") { S.activeOnly = e.target.checked; renderContent(); }
});

const fromHash = location.hash.slice(1);
if (TABS.some((t) => t.id === fromHash)) S.tab = fromHash;
if (!TABS.some((t) => t.id === S.tab)) S.tab = "accounts";
renderTabs(); renderToolbar();
load(true);
setInterval(() => { if (!document.hidden) load(false); }, POLL_MS);
</script>
</body>
</html>
